name: Deploy Private Marketplace preview to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'README.md'
      - 'privatemarketplace/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: privatemarketplace/site/package-lock.json

      - name: Install VitePress dependencies
        working-directory: privatemarketplace/site
        run: npm ci

      - name: Build the preview site
        working-directory: privatemarketplace/site
        run: npm run docs:build

      - name: Assemble repository Pages site
        working-directory: privatemarketplace/site
        run: npm run pages:assemble

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: privatemarketplace/site/.vitepress/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
