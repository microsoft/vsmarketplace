name: Deploy Private Marketplace preview to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'README.md'
      - 'privatemarketplace/**'
      - '.github/workflows/private-marketplace-preview-pages.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'README.md'
      - 'privatemarketplace/**'
      - '.github/workflows/private-marketplace-preview-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('github-pages-pr-{0}', github.event.pull_request.number) || 'github-pages' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: privatemarketplace/site/package-lock.json

      - name: Install VitePress dependencies
        working-directory: privatemarketplace/site
        run: npm ci

      - name: Build the preview site
        working-directory: privatemarketplace/site
        run: npm run docs:build

      - name: Assemble repository Pages site
        working-directory: privatemarketplace/site
        run: npm run pages:assemble

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: privatemarketplace/site/.vitepress/pages

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
